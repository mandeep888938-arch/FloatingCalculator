<!DOCTYPE html>
<html lang="pa"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ਕੈਲਕੁਲੇਟਰ</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e2e5ea;min-height:100vh}
@media (prefers-color-scheme:dark){body{background:#1c1f26}}
/* ਛੋਟੀ ਸਕ੍ਰੀਨ: ਕੈਲਕੁਲੇਟਰ ਤੋਂ ਬਾਹਰਲਾ ਖੇਤਰ ਪਾਰਦਰਸ਼ੀ (ਪਿੱਛੇ ਵਾਲੀ ਐਪ ਦਿਸੇ); ਪਿਛੋਕੜ ਸਿਰਫ਼ ਫੁੱਲ ਸਕ੍ਰੀਨ ਵਿੱਚ */
html:not(.hk-full),html:not(.hk-full) body{background:transparent!important}
</style>
<style>
/* ================= ਕੈਲਕੁਲੇਟਰ (+ − × ÷) ================= */
.hkc-panel{--cop:.85;--hkc-bg:255,255,255;--hkc-txt:#111827;--hkc-mut:#6b7280;--hkc-line:rgba(17,24,39,.16);--hkc-acc:#ea580c;--hkc-acc-rgb:234,88,12;--hkc-fn:#c2410c;--hkc-hl:rgba(234,88,12,.16);
  position:fixed;left:0;top:0;width:232px;z-index:1200;display:none;flex-direction:column;border-radius:24px;padding:6px 8px 42px;color:var(--hkc-txt);
  transform-origin:0 0;isolation:isolate;background:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* ਪਿਛੋਕੜ ਵੱਖਰੀ ਪਰਤ 'ਤੇ: ਪਾਰਦਰਸ਼ਤਾ ਬਦਲਣ ਨਾਲ ਸਿਰਫ਼ opacity ਬਦਲਦੀ ਹੈ (ਹਲਕਾ ਤੇ ਤੇਜ਼) */
.hkc-panel::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:rgb(var(--hkc-bg));opacity:var(--cop);border:1.5px solid rgba(128,128,128,.4);
  box-shadow:0 10px 26px rgba(0,0,0,.34)}
.hkc-panel.drag{will-change:transform}
.hkc-main{text-shadow:0 0 4px rgba(var(--hkc-bg),.7)}
.hkc-panel.open{display:flex;animation:hkcPop .18s ease-out}
@keyframes hkcPop{from{opacity:0}to{opacity:1}}
@media (prefers-color-scheme:dark){.hkc-panel{--hkc-bg:10,10,12;--hkc-txt:#f3f4f6;--hkc-mut:#8b8f98;--hkc-line:rgba(255,255,255,.16);--hkc-acc:#ff7a2f;--hkc-acc-rgb:255,122,47;--hkc-fn:#d9622b;--hkc-hl:rgba(255,122,47,.18)}}

/* ਹੈਡਰ: ਪੂਰੀ ਪੱਟੀ ਫੜ ਕੇ ਖਿੱਚੋ */
.hkc-head{display:flex;align-items:center;gap:6px;padding:0 2px 4px}
.hkc-grip{flex:none;width:44px;height:38px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;border-radius:12px}
.hkc-grip:active{cursor:grabbing;background:transparent}
.hkc-dots{flex:none;width:26px;height:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-content:center;opacity:.55}
.hkc-dots i{display:block;width:4px;height:4px;border-radius:50%;background:var(--hkc-txt)}
.hkc-hbtn{flex:none;width:34px;height:34px;border-radius:12px;border:1px solid var(--hkc-line);background:transparent;color:var(--hkc-txt);font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-shadow:none;touch-action:manipulation}
.hkc-hbtn:active{transform:scale(.92);background:var(--hkc-hl)}
#hkcFs{border:0;background:transparent;width:46px;height:40px;position:relative}
#hkcFs::after{content:"";position:absolute;left:-6px;right:-6px;top:-8px;bottom:-8px} /* ਦਬਾਉਣ ਵਾਲਾ ਖੇਤਰ ਵੱਡਾ */
#hkcFs svg{width:17px;height:17px;stroke-width:1.6} /* ਫੁੱਲ ਸਕ੍ਰੀਨ ਤੀਰ ਛੋਟਾ (ਦਬਾਉਣ ਵਾਲਾ ਖੇਤਰ ਉਹੀ) */
#hkcClose{width:20px;height:20px;border-radius:7px;font-size:10px;color:#ef4444;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45)}
#hkcClose:active{background:rgba(239,68,68,.28)}

/* ਪਾਰਦਰਸ਼ਤਾ ਸਲਾਈਡਰ */
.hkc-op{flex:1;min-width:0;display:flex;align-items:center;gap:5px}
.hkc-op span{font-size:.8rem;color:var(--hkc-mut);font-weight:800;line-height:1}
.hkc-op b{flex:none;min-width:30px;text-align:right;font-size:.72rem;font-weight:800;color:var(--hkc-mut)}
.hkc-sl{flex:1;position:relative;height:34px;margin:0 8px;touch-action:none;cursor:pointer}
.hkc-sl .trk{position:absolute;left:0;right:0;top:15px;height:4px;box-sizing:border-box;border-radius:4px;background:#fff;border:1px solid rgba(128,128,128,.7);box-shadow:0 0 0 .5px rgba(0,0,0,.3)}
.hkc-sl .thb{position:absolute;top:9px;left:15%;width:16px;height:16px;box-sizing:border-box;margin-left:-8px;border-radius:50%;background:#fff;border:1.5px solid var(--hkc-acc);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hkc-tape{contain:layout paint;height:200px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:3px 4px;scrollbar-width:none}
.hkc-tape::-webkit-scrollbar{display:none}
.hkc-empty{font-size:.7rem;line-height:1.45;color:var(--hkc-mut);text-align:right;padding:8px 10px;font-weight:600}
.hkc-row{padding:1px 10px;border-radius:12px;text-align:right;cursor:pointer;}
.hkc-row .n{display:inline;padding:1px 2px;margin:0;border-radius:4px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hkc-row .n:active{background:var(--hkc-hl)}
.hkc-row .n.sel{background:rgba(var(--hkc-acc-rgb),.38);outline:0;color:var(--hkc-txt);font-weight:600}
.hkc-panel.pend .hkc-k.op,.hkc-panel.pend .hkc-k[data-k="C"],.hkc-panel.pend .hkc-k[data-k="%"]{opacity:.3;pointer-events:none}
.hkc-panel.pend .hkc-k.eq::before{background:#2196f3;box-shadow:0 3px 10px rgba(33,150,243,.35)}
.hkc-row .e{font-size:.92rem;color:var(--hkc-mut);word-break:break-all;line-height:1.35}
.hkc-row .r{font-size:1.05rem;color:var(--hkc-mut);line-height:1.3}
.hkc-row.hit{background:var(--hkc-acc)!important}
.hkc-row.hit .e,.hkc-row.hit .r{color:#fff!important}
.hkc-main{padding:4px 12px 6px;text-align:right;border-bottom:1px solid var(--hkc-line)}
.hkc-expr{height:64px;display:flex;flex-direction:column;font-size:1.3rem;font-weight:300;color:var(--hkc-txt);word-break:break-all;line-height:1.35;padding:2px 2px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.hkc-expr::-webkit-scrollbar{display:none}
.hkc-expr .ex{display:block;margin-top:auto;flex:none}
.hkc-sel{background:rgba(var(--hkc-acc-rgb),.38);outline:0;border-radius:4px;padding:1px 0;margin:0;font-weight:500;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hkc-total{height:38px;font-size:1.9rem;font-weight:300;line-height:1.25;color:var(--hkc-txt);white-space:nowrap;overflow:hidden}
.hkc-total.err{color:#ef4444;font-size:1rem;font-weight:700}
.hkc-total.hint{color:var(--hkc-acc);font-size:.85rem;font-weight:700;line-height:1.4}

.hkc-keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:34px;gap:2px;margin-top:4px;position:relative;z-index:3} /* ਬਟਨ ਆਕਾਰ-ਬਦਲਣ ਵਾਲੀ ਪਕੜ ਦੇ ਉੱਪਰ: ਹੇਠਲਾ ਅੱਧ ਦਬਾਉਣ 'ਤੇ ਵੀ ਚੱਲਦਾ ਹੈ */
.hkc-k{border:0;border-radius:13px;background:transparent;font-size:1.2rem;font-weight:300;color:var(--hkc-txt);cursor:pointer;padding:0;transition:none;text-shadow:none}
.hkc-k:active{background:var(--hkc-hl)}
.hkc-k.op{color:var(--hkc-acc);font-size:1.45rem;font-weight:400}
.hkc-k.fn{color:var(--hkc-fn);font-size:1.45rem;font-weight:400}
.hkc-k.wide{grid-column:span 2}
.hkc-k.eq{margin-top:10px}
.hkc-k.eq{position:relative;isolation:isolate;background:transparent;color:var(--hkc-acc);font-size:1.45rem;font-weight:500;text-shadow:none;box-shadow:none}
.hkc-k.eq::before{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;z-index:-1;background:rgba(var(--hkc-acc-rgb),calc(.22 + var(--cop) * .78));box-shadow:0 3px 10px rgba(249,115,22,calc(var(--cop) * .3))}
.hkc-k.eq{color:#fff}
.hkc-k.eq:active{background:var(--hkc-hl)}
.hkc-rz{position:absolute;right:-6px;bottom:-6px;width:68px;height:46px;border-radius:0;cursor:nwse-resize;touch-action:none;opacity:.75;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 15px 13px 0;text-shadow:none}
.hkc-rz svg{width:16px;height:16px;stroke:var(--hkc-txt);stroke-width:2;stroke-linecap:round;fill:none}

/* ਕੈਲਕੁਲੇਟਰ: ਹੇਠਲੇ ਖੱਬੇ ਪਾਸੇ ਵੀ ਹਿਲਾਉਣ ਵਾਲੀ ਪਕੜ (ਕੀਪੈਡ ਦੇ ਹੇਠਾਂ ਖਾਲੀ ਪੱਟੀ ਵਿੱਚ, 0/00 ਉੱਤੇ ਨਹੀਂ ਚੜ੍ਹਦੀ) */
.hkc-grip.bl{position:absolute;left:64px;right:68px;bottom:0;width:auto;height:38px;z-index:2;justify-content:flex-start;padding-left:calc(50% - 77px);box-sizing:border-box;border-radius:12px} /* ਡੌਟਸ ਹਰ ਚੌੜਾਈ 'ਤੇ ਪੈਨਲ ਦੇ ਐਨ ਵਿਚਕਾਰ; ਪਕੜ ਸੱਜੇ ਪਾਸੇ ਸਾਈਜ਼ ਵਾਲੇ ਬਟਨ (68px) ਤੱਕ ਨਹੀਂ ਪਹੁੰਚਦੀ */

.hkc-pw{display:block;height:11px;line-height:11px;padding:5px 0 0 0;margin:0 0 -5px 0;font-size:.5rem;font-weight:800;color:var(--hkc-mut);opacity:.85;text-shadow:none;white-space:nowrap;pointer-events:none;text-align:left}
.hkc-pw+.hkc-keys{margin-top:1px}
/* ਹੇਠਲੇ ਖੱਬੇ ਪਾਸੇ fx ਬਟਨ: ਸਾਇੰਟੀਫ਼ਿਕ ਬਟਨਾਂ ਦੀ ਸਕ੍ਰੀਨ ਖੋਲ੍ਹਦਾ/ਬੰਦ ਕਰਦਾ ਹੈ */
.hkc-fx{position:absolute;left:4px;bottom:0;width:58px;height:38px;z-index:4;border-radius:14px;border:0;background:transparent;color:var(--hkc-txt);font:inherit;font-size:.92rem;font-weight:700;font-style:italic;padding:0;cursor:pointer;text-shadow:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.hkc-fx:active{background:var(--hkc-hl)}
.hkc-fx.on{background:transparent;color:var(--hkc-txt)}
.hkc-fx svg{stroke-width:1.55}
.hkc-panel.fsz .hkc-fx svg{stroke-width:1.35}
/* ਸਾਇੰਟੀਫ਼ਿਕ ਬਟਨ (ਹਿਸਟਰੀ ਵਾਲੀ ਥਾਂ 'ਤੇ ਆਉਂਦੇ ਹਨ; ਨਤੀਜਾ ਤੇ ਕੀਪੈਡ ਦਿਸਦੇ ਰਹਿੰਦੇ ਹਨ) */
.hkc-sci{display:none;touch-action:none}
.hkc-panel.sci .hkc-sci{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:1px 2px;height:206px;padding:3px 4px;box-sizing:border-box}
.hkc-panel.sci .hkc-tape{display:none}
.hkc-panel.fsz.sci .hkc-sci{flex:1 1 0;height:auto;min-height:0}
.hkc-sk{border:0;border-radius:10px;background:transparent;color:var(--hkc-txt);opacity:.85;font:inherit;font-size:.8rem;font-weight:400;padding:0;cursor:pointer;touch-action:none;text-shadow:none;white-space:nowrap;min-width:0;overflow:hidden}
.hkc-sk:active{background:var(--hkc-hl)}
.hkc-sk sup{font-size:.62em;line-height:0;position:relative;top:-.15em;vertical-align:baseline;margin-left:1px}
.hkc-sk.mm{color:var(--hkc-acc);opacity:1;font-weight:600}
.hkc-sk.mon{box-shadow:inset 0 0 0 1.5px var(--hkc-acc)}
.hkc-sk.on{background:var(--hkc-acc);color:#fff;opacity:1}
.tl-t{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tl-t.lift{position:relative;z-index:3;pointer-events:none;transition:none!important;color:var(--hkc-txt);background:linear-gradient(var(--hkc-hl),var(--hkc-hl)),rgb(var(--hkc-bg));box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tl-grid.dg{overflow-x:hidden}
.hkc-main,.hkc-keys,.hkc-k{touch-action:none}
.hkc-tools{position:absolute;left:8px;right:8px;top:46px;bottom:40px;z-index:3;display:none;flex-direction:column;background:rgb(var(--hkc-bg));border-radius:14px;overflow:hidden;text-shadow:none;touch-action:pan-y;color:var(--hkc-txt)}
.hkc-tools.on{display:flex;animation:hkcPop .18s ease-out}
.tl-h{display:flex;align-items:center;gap:8px;padding:2px;font-weight:700;font-size:.95rem}
.tl-h .hkc-hbtn{width:42px;height:42px;border-radius:14px;font-size:26px;line-height:1;padding-bottom:3px} /* ਵਾਪਸੀ ਤੀਰ ਵੱਡਾ */
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow-y:auto;flex:1;align-content:start;scrollbar-width:none}
.tl-t{border:0;background:transparent;color:var(--hkc-mut);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:8px 1px;border-radius:12px;font-size:.62rem;line-height:1.2;text-align:center;cursor:pointer}
.tl-t b{font-size:1.5rem;font-weight:400;line-height:1.2}
.tl-t:active{background:var(--hkc-hl)}
.tl-t b svg{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tl-body{padding:2px 4px;overflow-y:auto;flex:1;user-select:text;-webkit-user-select:text}
.tl-body label{display:block;font-size:.65rem;color:var(--hkc-mut);margin:4px 0 1px}
.tl-body input,.tl-body select{width:100%;box-sizing:border-box;font-size:.95rem;padding:5px 8px;border-radius:10px;border:1px solid var(--hkc-line);background:transparent;color:var(--hkc-txt);outline:0;font-family:inherit}
.tl-body option{background:rgb(var(--hkc-bg));color:var(--hkc-txt)}
.tl-res{margin-top:6px;padding:5px 8px;border-radius:10px;background:var(--hkc-hl);font-size:1.05rem;font-weight:600;text-align:right;word-break:break-all;min-height:22px;line-height:1.35}
.tl-body .ag-r{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 0;font-size:.8rem}
.tl-body .ag-r input{width:auto;flex:none;border:0;padding:2px;font-size:.82rem;font-weight:700;text-align:right;color:var(--hkc-txt);color-scheme:light dark}
.tl-body .ag-r input.o{color:var(--hkc-acc)}
.ag-c{margin-top:6px;padding:8px 6px;border-radius:16px;background:rgba(128,128,128,.14);text-align:center}
.ag-t{display:flex;align-items:stretch}.ag-t>div:not(.ag-v){flex:1;min-width:0}
.ag-v{width:1px;background:var(--hkc-line);margin:0 4px}
.ag-h{font-size:.95rem;font-weight:300;text-align:left;padding-left:4px}.ag-h.o{color:var(--hkc-acc);font-size:.62rem;font-weight:600;text-align:center;padding:0}
.ag-big{font-size:.75rem;text-align:left;padding-left:4px;margin:2px 0}.ag-big b{font-size:2.5rem;font-weight:300;color:var(--hkc-acc);line-height:1}
.ag-c small{display:block;font-size:.58rem;color:var(--hkc-txt);line-height:1.3}
.ag-cake{width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--hkc-acc);margin:5px auto;font-size:1rem}
.ag-m{font-size:.8rem}
.ag-s{margin:8px 0 4px;padding-top:6px;border-top:1px solid var(--hkc-line);color:var(--hkc-acc);font-size:.8rem}
.ag-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 2px}
.ag-g small{color:var(--hkc-mut);font-size:.58rem}.ag-g b{font-size:.85rem;font-weight:400;word-break:break-all}
.bm-r{display:flex;gap:6px}.bm-r select{flex:1.3;min-width:0}.bm-r input{flex:1;min-width:0;text-align:right;color:var(--hkc-acc);font-weight:600}
.tl-sel{display:block;width:100%;box-sizing:border-box;text-align:left;font:inherit;font-size:.9rem;padding:5px 8px;border-radius:10px;border:1px solid var(--hkc-line);background:transparent;color:var(--hkc-txt);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-r .tl-sel{flex:1.3;min-width:0;width:auto}
.tl-sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end}
.tl-bd{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45)}
.tl-sh{position:relative;display:flex;flex-direction:column;max-height:94%;padding:8px 6px 6px;border-radius:18px 18px 0 0;background:linear-gradient(rgba(128,128,128,.22),rgba(128,128,128,.22)),rgb(var(--hkc-bg));animation:hkcPop .15s ease-out}
.tl-st{text-align:center;font-weight:600;font-size:.85rem;padding:4px}
.tl-sl{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;touch-action:pan-y}
.tl-so{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--hkc-txt);font:inherit;font-size:.85rem;padding:10px 12px;cursor:pointer;border-radius:10px}
.tl-so.on{color:var(--hkc-acc);font-weight:700}.tl-so:active{background:var(--hkc-hl)}
.tl-so{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tl-so.lift{position:relative;z-index:3;pointer-events:none;transition:none;color:var(--hkc-txt);background:linear-gradient(var(--hkc-hl),var(--hkc-hl)),rgb(var(--hkc-bg));box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tl-hint{text-align:center;font-size:.6rem;color:var(--hkc-mut);padding:0 4px 4px}
.tl-cn{margin:6px 4px 2px;border:0;border-radius:20px;padding:9px;background:rgba(128,128,128,.28);color:var(--hkc-mut);font:inherit;font-size:.85rem;cursor:pointer}
.bm-sc{margin-top:10px}
.bm-bar{position:relative;display:flex;height:10px;border-radius:6px;overflow:visible}
.bm-bar i{display:block;height:100%}.bm-bar i:first-child{border-radius:6px 0 0 6px}.bm-bar i:nth-child(4){border-radius:0 6px 6px 0}
.bm-bar u{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;box-sizing:border-box;border-radius:50%;background:#fff;border:3px solid var(--hkc-txt);transition:left .25s;text-decoration:none}
.bm-nm{display:flex;margin-top:6px}.bm-nm span{flex:none;font-size:.55rem;color:var(--hkc-mut);text-align:center;line-height:1.2}
.bm-nm span:nth-child(1){width:28.33%}.bm-nm span:nth-child(2){width:21.67%}.bm-nm span:nth-child(3){width:16.67%}.bm-nm span:nth-child(4){width:33.33%}
.bm-nm span.on{color:var(--hkc-txt);font-weight:800}
.bm-tk{position:relative;height:12px;margin-top:2px}.bm-tk span{position:absolute;transform:translateX(-50%);font-size:.55rem;color:var(--hkc-mut)}
.tl-res small{font-size:.72rem;font-weight:500;color:var(--hkc-mut)}
/* ਟੂਲ ਖੁੱਲ੍ਹਣ 'ਤੇ ਕੈਲਕੁਲੇਟਰ ਦਾ ਕੀਪੈਡ ਹੇਠਾਂ ਦਿਸਦਾ ਰਹਿੰਦਾ ਹੈ */
.hkc-panel.tl .hkc-k.op:not([data-k="−"]),.hkc-panel.tl .hkc-k[data-k="%"]{opacity:.3}
.tl-body input.act{border-color:var(--hkc-acc);box-shadow:0 0 0 1px var(--hkc-acc)}

<script>
(function(){
  var KEY='nt_calc_state_v1', OPS='+−×÷^√', BASE_W=248;
  var st={x:null,y:null,tr:15,s:1,open:false,hist:[]};
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'null'); if(sv&&typeof sv==='object') for(var k in sv) st[k]=sv[k];}catch(e){}
  if(!Array.isArray(st.hist)) st.hist=[];
  var mem=+st.mem||0, ang=(st.ang==='rad')?'rad':'deg'; /* ਮੈਮੋਰੀ (m+ m− mr) ਅਤੇ ਡਿਗਰੀ/ਰੇਡੀਅਨ */
  st.open=false; /* ਹਿਸਾਬ-ਕਿਤਾਬ ਖੁੱਲ੍ਹਣ 'ਤੇ ਕੈਲਕੁਲੇਟਰ ਹਮੇਸ਼ਾ ਬੰਦ */
  var $=function(id){return document.getElementById(id)};
  var panel=$('hkcPanel'), fab=document.createElement('button'), tape=$('hkcTape'), exprEl=$('hkcExpr'), totEl=$('hkcTotal'), slider=$('hkcOp'), trLbl=$('hkcTr');
  if(!panel||!fab) return;
  var expr='', done=false, hintTimer=0, hl=null, rawSub=null, rep=null; /* rawSub: = ਤੋਂ ਬਾਅਦ ਨਤੀਜੇ ਦਾ ਅਸਲ (ਬਿਨਾਂ ਗੋਲ) ਮੁੱਲ */
  var pend=null, eqBtn=panel.querySelector('[data-k="="]');
  function cancelPend(){
    if(!pend) return;
    if(pend.node) pend.node.classList.remove('sel');
    pend=null; panel.classList.remove('pend'); if(eqBtn) eqBtn.textContent='=';
  }
  function selectAmt(node,v){
    if(pend&&pend.node===node){ cancelPend(); return; }  /* ਉਹੀ ਰਕਮ ਦੁਬਾਰਾ ਛੂਹੋ = ਚੋਣ ਹਟਾਓ */
    if(pend&&pend.node) pend.node.classList.remove('sel');
    pend={node:node,v:v}; node.classList.add('sel');
    panel.classList.add('pend'); if(eqBtn) eqBtn.textContent='✓';
  }

  var saveT=0;
  function saveNow(){ clearTimeout(saveT); saveT=0; try{var q=(fs&&prev)?prev:st; localStorage.setItem(KEY,JSON.stringify({x:q.x,y:q.y,tr:st.tr,s:q.s,open:st.open,hist:st.hist.slice(-200),mem:mem,ang:ang}))}catch(e){} }
  function save(){ clearTimeout(saveT); saveT=setTimeout(saveNow,1200); } /* ਲਿਖਣਾ ਬਾਅਦ 'ਚ, ਬਟਨ ਤੁਰੰਤ */
  window.addEventListener('pagehide',saveNow);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) saveNow(); });
  function buzz(){}

  /* ---- ਹਿਸਾਬ (eval ਤੋਂ ਬਿਨਾਂ) ---- */
  function isNumCh(c){return c!==undefined&&/[0-9.]/.test(c)}
  /* ਫੰਕਸ਼ਨ ਟੋਕਨ (ਹਰ ਇੱਕ '(' ਨਾਲ ਖ਼ਤਮ) */
  var FNS=['sinh⁻¹(','cosh⁻¹(','tanh⁻¹(','sin⁻¹(','cos⁻¹(','tan⁻¹(','sinh(','cosh(','tanh(','sin(','cos(','tan(','log₂(','lg(','ln(','√('];
  /* ਹਿਸਾਬ: eval ਤੋਂ ਬਿਨਾਂ; + − × ÷ ^ x√y ! ( ) ਅਤੇ ਫੰਕਸ਼ਨ; 2π, 3(4+1) ਵਰਗਾ ਗੁਣਾ ਆਪਣੇ-ਆਪ */
  function calc(s,raw){
    if(rawSub&&s.indexOf(rawSub.t)===0&&!/[0-9.]/.test(s.charAt(rawSub.t.length))) s=rawSub.v+s.slice(rawSub.t.length);
    var n=s.length, i=0, K=(ang==='rad')?1:Math.PI/180;
    while(n>0&&OPS.indexOf(s[n-1])>=0) n--;
    if(n===0) return null;
    s=s.slice(0,n);
    function fnAt(){ for(var k=0;k<FNS.length;k++) if(s.substr(i,FNS[k].length)===FNS[k]) return FNS[k]; return null; }
    function opnd(){ var c=s[i]; return c!==undefined&&(/[0-9.]/.test(c)||c==='('||c==='π'||c==='e'||!!fnAt()); }
    function num(){ var j=i; while(j<n&&/[0-9.]/.test(s[j])) j++; var v=parseFloat(s.slice(i,j)); if(isNaN(v)) throw 'syn'; i=j; return v; }
    function fact(v){ if(v<0||v!==Math.floor(v)) throw 'dom'; if(v>170) throw 'ovf'; var r=1; for(var k=2;k<=v;k++) r*=k; return r; }
    function pw(a,b){ if(a===0&&b<0) throw 'div0'; var r=Math.pow(a,b); if(r!==r) throw 'dom'; if(!isFinite(r)) throw 'ovf'; return r; }
    function nroot(x,y){ if(x===0) throw 'div0'; if(y<0){ if(x===Math.floor(x)&&Math.abs(x%2)===1) return -Math.pow(-y,1/x); throw 'dom'; } return Math.pow(y,1/x); }
    function zz(v){ return Math.abs(v)<1e-14?0:v; }
    function fn(f,a){
      switch(f){
        case 'sin(': return zz(Math.sin(a*K));
        case 'cos(': return zz(Math.cos(a*K));
        case 'tan(': { var m=a*K; if(Math.abs(Math.cos(m))<1e-12) throw 'dom'; return zz(Math.tan(m)); }
        case 'sin⁻¹(': if(a>1||a<-1) throw 'dom'; return Math.asin(a)/K;
        case 'cos⁻¹(': if(a>1||a<-1) throw 'dom'; return Math.acos(a)/K;
        case 'tan⁻¹(': return Math.atan(a)/K;
        case 'sinh(': return Math.sinh(a);
        case 'cosh(': return Math.cosh(a);
        case 'tanh(': return Math.tanh(a);
        case 'sinh⁻¹(': return Math.asinh(a);
        case 'cosh⁻¹(': if(a<1) throw 'dom'; return Math.acosh(a);
        case 'tanh⁻¹(': if(a<=-1||a>=1) throw 'dom'; return Math.atanh(a);
        case 'ln(': if(a<=0) throw 'dom'; return Math.log(a);
        case 'lg(': if(a<=0) throw 'dom'; return Math.log10(a);
        case 'log₂(': if(a<=0) throw 'dom'; return Math.log2(a);
        case '√(': if(a<0) throw 'dom'; return Math.sqrt(a);
      }
      throw 'syn';
    }
    function pExpr(){ var v=pTerm(); while(i<n&&(s[i]==='+'||s[i]==='−')){ var o=s[i++], r=pTerm(), pv=v; v=(o==='+')?v+r:v-r; if(Math.abs(v)<1e-14*Math.max(Math.abs(pv),Math.abs(r))) v=0; } return v; }
    function pTerm(){
      var v=pUnary();
      for(;;){
        var c=s[i];
        if(c==='×'||c==='÷'){ i++; var r=pUnary(); if(c==='÷'){ if(r===0) throw 'div0'; v=v/r; } else v=v*r; }
        else if(opnd()) v=v*pUnary();
        else break;
      }
      return v;
    }
    function pUnary(){ if(s[i]==='−'){ i++; return -pUnary(); } if(s[i]==='+'){ i++; return pUnary(); } return pPower(); }
    function pPower(){
      var b=pPost();
      while(s[i]==='√'){ i++; b=nroot(b,pPost()); }
      if(s[i]==='^'){ i++; return pw(b,pUnary()); }

      var k=f[0], r=k.getBoundingClientRect(), dx=(f[1]-r.left)/sc, dy=(f[2]-r.top)/sc;
      if(dx||dy) k.style.transform='translate('+dx+'px,'+dy+'px)';
    });
    void g.offsetWidth;
    first.forEach(function(f){ f[0].style.transition='transform .2s ease-out'; f[0].style.transform=''; });
  }
  function dgHit(){
    var o=document.elementFromPoint(dg.x,dg.y); o=o&&o.closest&&o.closest('.tl-t');
    if(o&&o!==dg.el&&dg.grid.contains(o)){ dgReorder(o); dgPlace(); }
  }
  function dgMove(x,y){ dg.x=x; dg.y=y; dgPlace(); dgHit(); }
  function dgTick(){
    if(!dg) return; var g=dg.grid, r=g.getBoundingClientRect(), v=0;
    if(dg.y<r.top+26) v=-8; else if(dg.y>r.bottom-26) v=8;
    if(v&&((v<0&&g.scrollTop>0)||(v>0&&g.scrollTop<g.scrollHeight-g.clientHeight))){ g.scrollTop+=v; dgPlace(); dgHit(); }
  }
  function dgEnd(){
    lpCancel(); if(!dg) return;
    clearInterval(dgTm); var d=dg; dg=null;
    d.el.classList.remove('lift'); d.el.style.transform=''; d.grid.classList.remove('dg');
    Array.prototype.forEach.call(d.grid.children,function(k){ k.style.transition=''; k.style.transform=''; });
    ord=Array.prototype.map.call(d.grid.children,function(k){ return +k.getAttribute('data-i'); });
    saveOrd(); noClk=Date.now()+450; /* ਛੱਡਣ ਵੇਲੇ ਟੂਲ ਖੁੱਲ੍ਹ ਨਾ ਜਾਵੇ */
  }
  T.addEventListener('click',function(e){ if(Date.now()<noClk){ e.stopPropagation(); e.preventDefault(); } },true);
  T.addEventListener('contextmenu',function(e){ if(e.target.closest&&e.target.closest('.tl-grid')) e.preventDefault(); });
  T.addEventListener('touchstart',function(e){ if(e.touches.length===1) lpStart(e.touches[0].clientX,e.touches[0].clientY,e.target); else { lpCancel(); dgEnd(); } },{passive:true});
  T.addEventListener('touchmove',function(e){
    var t=e.touches[0]; if(!t) return;
    if(dg){ e.preventDefault(); dgMove(t.clientX,t.clientY); } else lpMove(t.clientX,t.clientY);
  },{passive:false});
  T.addEventListener('touchend',dgEnd,{passive:true});
  T.addEventListener('touchcancel',dgEnd,{passive:true});
  T.addEventListener('pointerdown',function(e){ if(e.pointerType==='mouse'&&e.button===0) lpStart(e.clientX,e.clientY,e.target); });
  window.addEventListener('pointermove',function(e){ if(e.pointerType!=='mouse') return; if(dg) dgMove(e.clientX,e.clientY); else lpMove(e.clientX,e.clientY); });
  window.addEventListener('pointerup',function(e){ if(e.pointerType==='mouse') dgEnd(); });
  /* ਸਵਾਈਪ: ਛੂਹ ਲਈ touch ਘਟਨਾਵਾਂ (ਇਹ ਰੱਦ ਨਹੀਂ ਹੁੰਦੀਆਂ), ਮਾਊਸ ਲਈ pointer; ਉਂਗਲ ਹਿਲਦੇ ਹੀ ਚੱਲ ਪੈਂਦਾ ਹੈ */
  function swS(t,x,y){ sw=(t.closest&&t.closest('.hkc-main,.hkc-tape,.hkc-tools,.hkc-keys')&&!t.closest('input,select,.hkc-hbtn,.tl-sheet'))?{x:x,y:y,in:!!t.closest('.hkc-tools')}:null; }
  function swM(x,y){
    if(!sw) return; var dx=(x-sw.x)/st.s, dy=(y-sw.y)/st.s;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){
      var s=sw; sw=null;
      if(dx<0&&!s.in){ showGrid(); tOpen(); } else if(dx>0&&s.in) tBack();
    }
  }
  var po={capture:true,passive:true};
  panel.addEventListener('touchstart',function(e){ if(e.touches.length===1) swS(e.target,e.touches[0].clientX,e.touches[0].clientY); else sw=null; },po);
  panel.addEventListener('touchmove',function(e){ if(e.touches.length===1) swM(e.touches[0].clientX,e.touches[0].clientY); },po);
  panel.addEventListener('touchend',function(){ sw=null; },po);
  panel.addEventListener('touchcancel',function(){ sw=null; },po);
  panel.addEventListener('pointerdown',function(e){ if(e.pointerType==='mouse') swS(e.target,e.clientX,e.clientY); },true);
  panel.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse') swM(e.clientX,e.clientY); },true);
  panel.addEventListener('pointerup',function(e){ if(e.pointerType==='mouse') sw=null; },true);
  /* ---- ਫੁੱਲ ਸਕ੍ਰੀਨ ↔ ਛੋਟਾ ਬਟਨ (ਉੱਪਰ ਖੱਬੇ) ---- */
  var fsB=$('hkcFs'), fs=false, prev=null;
  var SV='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="';
  var EXP=SV+'M4 4l16 16M4 9.5V4h5.5M20 14.5V20h-5.5"/></svg>', SHR=SV+'M4 4l6.5 6.5M10.5 5.5v5h-5M20 20l-6.5-6.5M13.5 18.5v-5h5"/></svg>';
  function fsIcon(on){ fs=on; document.documentElement.classList.toggle('hk-full',on); fsB.innerHTML=on?SHR:EXP; if(!on){ panel.classList.remove('fsz'); panel.style.height=''; panel.style.width=''; } }
  /* ਪੂਰੀ ਸਕ੍ਰੀਨ: ਵੱਡਾ (zoom) ਨਹੀਂ ਕਰਦੇ; ਪੈਨਲ ਦੀ ਚੌੜਾਈ-ਉਚਾਈ ਹੀ ਸਕ੍ਰੀਨ ਜਿੰਨੀ ਕਰਦੇ ਹਾਂ, ਅੱਖਰ ਤੇ ਬਟਨ ਆਮ ਆਕਾਰ ਦੇ ਰਹਿੰਦੇ ਹਨ */
  var FS_MAXW=330; /* ਵੱਡੀ ਸਕ੍ਰੀਨ 'ਤੇ ਚੌੜਾਈ ਸੀਮਤ (ਫ਼ੋਨ 'ਤੇ ਪਹਿਲਾਂ ਵਾਂਗ ਪੂਰੀ) */
  function fsFit(){
    var vw=window.innerWidth, vh=window.innerHeight;
    panel.classList.add('fsz'); panel.style.width=Math.max(200,vw-16)+'px'; panel.style.height=Math.max(300,vh-48)+'px'; measure(); /* ਪੈਨਲ ਦੀ padding (16 ਤੇ 48) ਜੋੜ ਕੇ ਪੂਰੀ ਸਕ੍ਰੀਨ */
    st.s=1; st.x=0; st.y=0;
  }
  fsB.addEventListener('click',function(e){
    e.stopPropagation(); measure();
    if(!fs){ prev={s:st.s,x:st.x,y:st.y}; fsFit(); fsIcon(true); }
    else { var p=prev||{s:1,x:st.x,y:st.y}; fsIcon(false); measure(); st.s=clampS(p.s); st.x=p.x; st.y=p.y; }
    clampPos(); save();
  });
  window.addEventListener('resize',function(){ if(fs&&st.open){ fsFit(); clampPos(); } });
  fsIcon(false);
  applyTr(); renderTape(); render();
  window.ntCalcToggle=function(){ setOpen(!st.open); };
  setOpen(true); /* ਪੇਜ ਖੁੱਲ੍ਹਦੇ ਹੀ ਕੈਲਕੁਲੇਟਰ ਸਿੱਧਾ ਖੁੱਲ੍ਹਦਾ ਹੈ */
  /* ਸ਼ੁਰੂ ਵਿੱਚ ਛੋਟੇ ਆਕਾਰ ਵਿੱਚ, ਪਿਛਲੀ ਥਾਂ/ਸਾਈਜ਼ 'ਤੇ ਖੁੱਲ੍ਹਦਾ ਹੈ; ਉੱਪਰ ਖੱਬੇ ਬਟਨ ਨਾਲ ਫੁੱਲ ਸਕ੍ਰੀਨ */
  clampPos(); prev={s:st.s,x:st.x,y:st.y};
  fsIcon(true); fsFit(); clampPos(); /* ਸ਼ੁਰੂ ਵਿੱਚ ਪੂਰੀ ਸਕ੍ਰੀਨ 'ਤੇ ਖੁੱਲ੍ਹਦਾ ਹੈ */
  window.ntCalcClose=function(){ if(st.open) setOpen(false); };
  window.ntCalcIsOpen=function(){ return !!st.open; };
})();
</script>
